<form (ngSubmit)="iniciarSesion()" class="max-w-sm mx-auto pt-20 bg-emerald-200">
    <div class="mb-5">
        <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Correo</label>
        <input [(ngModel)]="email" name="email" type="email" id="email"
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
            placeholder="yo@gmail.com" required />
    </div>
    <div class="mb-5">
        <label for="password" class="block mb-2.5 text-sm font-medium text-heading">Contraseña</label>
        <input [(ngModel)]="password" name="password" type="password" id="password"
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
            placeholder="••••••••" required />
    </div>

    <button (click)="iniciarSesion()" type="submit"
        class="text-white mr-37.5 bg-green-400 box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Iniciar
        sesión</button>
    
</form>
